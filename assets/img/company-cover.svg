<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <defs>
    <linearGradient id="coverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2418"/>
      <stop offset="100%" stop-color="#6b4226"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" fill="url(#coverGrad)"/>
  <g opacity="0.5" fill="#c9a24b">
    <circle cx="140" cy="80" r="4"/>
    <circle cx="300" cy="60" r="4"/>
    <circle cx="900" cy="90" r="4"/>
    <circle cx="1050" cy="70" r="4"/>
  </g>
  <!-- wooden tables silhouette -->
  <g fill="#2a180f">
    <rect x="0" y="260" width="1200" height="100"/>
    <rect x="80" y="220" width="220" height="18" rx="4"/>
    <rect x="150" y="238" width="14" height="60"/>
    <rect x="900" y="220" width="220" height="18" rx="4"/>
    <rect x="970" y="238" width="14" height="60"/>
  </g>
  <!-- hanging lamps -->
  <g stroke="#c9a24b" stroke-width="2" fill="#f4c542">
    <line x1="200" y1="0" x2="200" y2="70"/>
    <ellipse cx="200" cy="88" rx="22" ry="18"/>
    <line x1="450" y1="0" x2="450" y2="50"/>
    <ellipse cx="450" cy="68" rx="22" ry="18"/>
    <line x1="750" y1="0" x2="750" y2="60"/>
    <ellipse cx="750" cy="78" rx="22" ry="18"/>
    <line x1="1000" y1="0" x2="1000" y2="45"/>
    <ellipse cx="1000" cy="63" rx="22" ry="18"/>
  </g>
  <!-- beer glasses -->
  <g fill="#f4c542" opacity="0.85">
    <rect x="130" y="200" width="18" height="26" rx="2"/>
    <rect x="960" y="200" width="18" height="26" rx="2"/>
  </g>
</svg>
