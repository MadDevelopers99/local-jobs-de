<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <rect width="900" height="700" fill="#eaf3ea"/>
  <!-- park blocks -->
  <g fill="#d3e8d1">
    <rect x="60" y="80" width="160" height="140"/>
    <rect x="620" y="420" width="200" height="160"/>
    <rect x="700" y="60" width="140" height="120"/>
  </g>
  <!-- river -->
  <path d="M0 460 C150 420, 220 520, 340 480 S 560 400, 700 460 S 860 520, 900 500" stroke="#a9cbe8" stroke-width="26" fill="none" opacity="0.8"/>
  <!-- roads -->
  <g stroke="#ffffff" stroke-width="10" fill="none">
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="0" y1="330" x2="900" y2="330"/>
    <line x1="0" y1="560" x2="900" y2="560"/>
    <line x1="150" y1="0" x2="150" y2="700"/>
    <line x1="380" y1="0" x2="380" y2="700"/>
    <line x1="560" y1="0" x2="560" y2="700"/>
    <line x1="760" y1="0" x2="760" y2="700"/>
  </g>
  <g stroke="#f3d9a4" stroke-width="14" fill="none">
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="470" y1="0" x2="470" y2="700"/>
  </g>
  <!-- city blocks -->
  <g fill="#dbe6db">
    <rect x="200" y="20" width="60" height="90"/>
    <rect x="280" y="40" width="70" height="70"/>
    <rect x="420" y="30" width="80" height="90"/>
    <rect x="600" y="200" width="70" height="80"/>
    <rect x="200" y="380" width="90" height="70"/>
    <rect x="320" y="400" width="60" height="80"/>
    <rect x="600" y="600" width="80" height="60"/>
    <rect x="60" y="600" width="70" height="70"/>
  </g>
</svg>
